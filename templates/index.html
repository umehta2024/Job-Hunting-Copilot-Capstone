<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Job Hunting Copilot</title>
  <style>
    :root {
      --bg: #f0fdf4;
      --card-bg: #ffffff;
      --border: #d1fae5;
      --text: #1e293b;
      --muted: #64748b;
      --accent: #10b981;
      --accent-hover: #059669;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --radius: 12px;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      max-width: 900px;
      margin: 48px auto;
      padding: 0 20px;
      color: var(--text);
      background: var(--bg);
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .hint {
      color: var(--muted);
      font-size: 14px;
      margin-top: 4px;
      line-height: 1.6;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-top: 24px;
      box-shadow: 0 1px 3px rgba(16, 24, 40, 0.04);
    }

    label {
      display: block;
      margin-top: 16px;
      font-weight: 600;
      font-size: 13px;
      color: var(--text);
    }
    label:first-child { margin-top: 0; }

    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      margin-top: 6px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.15s ease;
    }
    input[type="text"]:focus, input[type="number"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.12);
    }

    button {
      margin-top: 18px;
      padding: 10px 18px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.15s ease;
    }
    button:hover { background: var(--accent-hover); }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    #result {
      margin-top: 16px;
      white-space: pre-wrap;
      background: #f6f6f6;
      padding: 12px 14px;
      border-radius: 8px;
      min-height: 20px;
      font-size: 13px;
      color: var(--muted);
    }
    #result:empty { display: none; }

    .job-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 16px;
      transition: all 0.2s ease;
    }
    .job-card:hover {
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.1);
      border-color: var(--accent);
    }

    .job-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 12px;
    }

    .job-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      margin: 0 0 8px 0;
    }

    .job-company {
      font-size: 15px;
      color: var(--accent);
      font-weight: 500;
      margin-bottom: 8px;
    }

    .job-meta {
      display: flex;
      gap: 16px;
      color: var(--muted);
      font-size: 13px;
      margin-top: 8px;
    }

    .job-description {
      font-size: 14px;
      color: var(--text);
      line-height: 1.6;
      margin-top: 12px;
    }

    .similarity-badge {
      background: var(--accent);
      color: white;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
    }

    .salary-badge {
      background: #f0fdf4;
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid var(--accent);
    }

    .save-btn {
      margin-top: 0;
      padding: 6px 14px;
      font-size: 13px;
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
    }
    .save-btn:hover { background: var(--accent); color: white; }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
    }

    .stats {
      display: flex;
      gap: 16px;
      margin-top: 16px;
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <h1>💼 Job Hunting Copilot</h1>
  <p class="hint">Semantic job search powered by vector embeddings. Search for jobs using natural language and find the best matches instantly!</p>

  <div class="card">
    <h2 style="font-size: 16px; font-weight: 600; margin-bottom: 16px;">🔍 Search Jobs</h2>
    <form id="search-form">
      <label for="query">What are you looking for?</label>
      <input type="text" id="query" name="query" placeholder="e.g., Python backend developer with microservices experience" required>
      
      <label for="location" style="margin-top: 16px;">Location (optional)</label>
      <input type="text" id="location" name="location" placeholder="e.g., London, UK">
      
      <label for="min_salary" style="margin-top: 16px;">Minimum Salary (optional)</label>
      <input type="number" id="min_salary" name="min_salary" placeholder="e.g., 70000">
      
      <label for="top_k" style="margin-top: 16px;">Number of results</label>
      <input type="number" id="top_k" name="top_k" value="10" min="1" max="50">
      
      <button type="submit">🚀 Search Jobs</button>
    </form>

    <div id="result"></div>
  </div>

  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
      <h2 style="font-size: 16px; font-weight: 600; margin: 0;">📋 Search Results</h2>
      <button onclick="loadRecentJobs()" style="margin: 0; padding: 6px 12px; font-size: 13px;">View All Jobs</button>
    </div>
    
    <div id="jobs-list"></div>
  </div>

  <script>
    const form = document.getElementById("search-form");
    const resultEl = document.getElementById("result");
    const jobsListEl = document.getElementById("jobs-list");

    async function searchJobs(query, location, minSalary, topK) {
      const body = { query, top_k: topK };
      if (location) body.location = location;
      if (minSalary) body.min_salary = parseFloat(minSalary);
      
      try {
        resultEl.textContent = "🔍 Searching for jobs...";
        
        const resp = await fetch("/jobs/search", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await resp.json();
        
        if (!resp.ok) {
          resultEl.textContent = "❌ Error: " + (data.error || resp.statusText);
          jobsListEl.innerHTML = "";
          return;
        }
        
        resultEl.textContent = `✅ Found ${data.count} job(s) matching "${query}"`;
        displayJobs(data.results);
        
      } catch (err) {
        resultEl.textContent = "❌ Request failed: " + err;
        jobsListEl.innerHTML = "";
      }
    }

    async function loadRecentJobs() {
      try {
        resultEl.textContent = "Loading recent jobs...";
        
        const resp = await fetch("/jobs?limit=10");
        const data = await resp.json();
        
        if (!resp.ok) {
          jobsListEl.innerHTML = `<div class="empty-state">Error loading jobs: ${data.error || resp.statusText}</div>`;
          resultEl.textContent = "";
          return;
        }
        
        resultEl.textContent = `📋 Showing ${data.count} recent job(s)`;
        displayJobs(data.jobs);
        
      } catch (err) {
        jobsListEl.innerHTML = `<div class="empty-state">Failed to load jobs: ${err}</div>`;
        resultEl.textContent = "";
      }
    }

    function displayJobs(jobs) {
      if (!jobs || jobs.length === 0) {
        jobsListEl.innerHTML = '<div class="empty-state">No jobs found. Try a different search query or check back later.</div>';
        return;
      }
      
      let html = "";
      jobs.forEach((job) => {
        const salary = formatSalary(job.salary_min, job.salary_max);
        const similarity = job.similarity ? Math.round(job.similarity * 100) : null;
        const description = (job.description || "").substring(0, 300);
        const showMore = job.description && job.description.length > 300;
        
        html += `
          <div class="job-card">
            <div class="job-header">
              <div style="flex: 1;">
                <h3 class="job-title">${escapeHtml(job.title || "Untitled Job")}</h3>
                <div class="job-company">${escapeHtml(job.company || "Company not listed")}</div>
                <div class="job-meta">
                  ${job.location ? `<span>📍 ${escapeHtml(job.location)}</span>` : ""}
                  ${salary ? `<span class="salary-badge">💰 ${salary}</span>` : ""}
                  ${job.created_date ? `<span>📅 ${formatDate(job.created_date)}</span>` : ""}
                </div>
              </div>
              ${similarity ? `<span class="similarity-badge">${similarity}% match</span>` : ""}
            </div>
            
            ${description ? `
              <div class="job-description">
                ${escapeHtml(description)}${showMore ? "..." : ""}
              </div>
            ` : ""}
            
            <div style="display: flex; gap: 8px; margin-top: 16px;">
              ${job.url ? `<a href="${job.url}" target="_blank" style="text-decoration: none;"><button>View Job</button></a>` : ""}
              <button class="save-btn" onclick="saveJob(${job.job_id})">💾 Save</button>
            </div>
          </div>
        `;
      });
      
      jobsListEl.innerHTML = html;
    }

    function formatSalary(min, max) {
      if (!min && !max) return null;
      if (min && max) return `£${formatNumber(min)} - £${formatNumber(max)}`;
      if (min) return `£${formatNumber(min)}+`;
      if (max) return `Up to £${formatNumber(max)}`;
    }

    function formatNumber(num) {
      return new Intl.NumberFormat('en-GB').format(num);
    }

    function formatDate(dateStr) {
      const date = new Date(dateStr);
      const now = new Date();
      const diffDays = Math.floor((now - date) / (1000 * 60 * 60 * 24));
      
      if (diffDays === 0) return "Today";
      if (diffDays === 1) return "Yesterday";
      if (diffDays < 7) return `${diffDays} days ago`;
      return date.toLocaleDateString('en-GB');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    async function saveJob(jobId) {
      try {
        const resp = await fetch("/jobs/save", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ job_id: jobId, user_id: 1 }),
        });
        const data = await resp.json();
        
        if (resp.ok) {
          alert("✅ Job saved to favorites!");
        } else {
          alert("❌ Failed to save job: " + (data.error || resp.statusText));
        }
      } catch (err) {
        alert("❌ Request failed: " + err);
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const query = document.getElementById("query").value;
      const location = document.getElementById("location").value;
      const minSalary = document.getElementById("min_salary").value;
      const topK = parseInt(document.getElementById("top_k").value) || 10;
      
      if (!query.trim()) {
        resultEl.textContent = "Please enter a search query.";
        return;
      }
      
      await searchJobs(query, location, minSalary, topK);
    });

    // Load recent jobs on page load
    loadRecentJobs();
  </script>
</body>
</html>
