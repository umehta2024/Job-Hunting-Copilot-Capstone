# Job Hunting Copilot - Databricks App Configuration

command:
  - "python"
  - "app.py"

env:
  - name: LAKEBASE_SECRET_SCOPE
    value: "job_hunting"
  - name: LAKEBASE_SECRET_KEY
    value: "lakebase_url"
  - name: JOBS_TABLE_NAME
    value: "job_postings"
  - name: EMBEDDINGS_TABLE_NAME
    value: "job_embeddings"
  - name: SAVED_JOBS_TABLE_NAME
    value: "saved_jobs"
