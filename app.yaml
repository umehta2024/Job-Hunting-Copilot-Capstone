# Databricks App configuration for Job Hunting MCP Server
# Deploy with: databricks apps create job-hunting-mcp
# Or via UI: Create App → Upload this folder

command:
  - "python"
  - "job_mcp_server.py"

# Dependencies
env:
  # Port will be set by Databricks Apps automatically
  - name: DATABRICKS_APP_PORT
    value: "8000"

# Resources (optional - adjust based on workload)
# resources:
#   cpu: "1"
#   memory: "4Gi"
