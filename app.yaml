command:
  - uvicorn
  - mcp_server.job_mcp_server:app
  - --host
  - "0.0.0.0"
  - --port
  - "8000"

resources:
  - name: app_id
    secret:
      scope: job_hunting
      key: app_id
      permission: READ
  - name: app_key
    secret:
      scope: job_hunting
      key: app_key
      permission: READ
  - name: lakebase_url
    secret:
      scope: job_hunting
      key: lakebase_url
      permission: READ
